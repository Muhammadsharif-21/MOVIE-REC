
<!DOCTYPE html>
<html lang="en">

<head>
  <title>{% block title %}Watchlist{% endblock %}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <div class="max">
    <div class="topbar">
      <h1>Watchlist</h1>
      <div class="user-chip" id="user-chip"></div>
    </div>

    {% block content %}{% endblock %}
  </div>

  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
