{% extends "base.html" %}

{% block title %}Watchlist{% endblock %}

{% block content %}
    <h2>Filter</h2>
    <div class="controls">
      <input type="text" id="search-title" placeholder="Search title…">
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="watching">Watching</option>
        <option value="completed">Completed</option>
        <option value="dropped">Dropped</option>
      </select>
      <select id="sort-field">
        <option value="">No sort</option>
        <option value="title">Title A–Z</option>
        <option value="-title">Title Z–A</option>
        <option value="rating">Rating low–high</option>
        <option value="-rating">Rating high–low</option>
      </select>
      <button class="primary" onclick="loadShows()">Apply</button>
    </div>

    <h2>Now Tracking</h2>
    <div id="shows-container"></div>
    <div class="controls" style="margin-top: 16px;">
      <button onclick="prevPage()">&larr; Prev</button>
      <span id="page-label" style="font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--text-dim);">Page 1</span>
      <button onclick="nextPage()">Next &rarr;</button>
    </div>

    <h2>Add a Show</h2>
    <div class="controls">
      <input type="text" id="title-input" placeholder="Title">
      <input type="text" id="genre-input" placeholder="Genre">
      <input type="text" id="status-input" placeholder="watching / completed / dropped">
      <button class="primary" onclick="addShow()">Add Show</button>
    </div>

    <h2>Danger Zone</h2>
    <div class="controls">
      <button class="danger" onclick="resetMyShows()">Clear all my shows</button>
    </div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/watchlist.js') }}"></script>
{% endblock %}
